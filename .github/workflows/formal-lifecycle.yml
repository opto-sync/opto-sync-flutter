name: Formal lifecycle and exhaustiveness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: Dart reducer and exhaustive matches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve, format, analyze, and test
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

  quint:
    name: Quint finite-model verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify canonical model provenance
        run: |
          printf '%s  %s\n' \
            c6cb526867779178e6fab89f1333113576764e3760c31314475d9b17207cd00d \
            formal/mobile_desktop_lifecycle.qnt | sha256sum --check --strict

      - name: Type-check, simulate, and exhaustively verify
        run: |
          set -euo pipefail
          quint='npx --yes --package=@informalsystems/quint@0.32.0 quint'
          $quint typecheck formal/mobile_desktop_lifecycle.qnt
          $quint run formal/mobile_desktop_lifecycle.qnt \
            --main=mobile_desktop_lifecycle --init=init --step=step \
            --backend=rust --max-samples=10000 --max-steps=30 \
            --invariants lifecycle_safety \
            --witnesses close_during_acquire_reached trailing_wake_reached cancellation_reached
          $quint verify formal/mobile_desktop_lifecycle.qnt \
            --main=mobile_desktop_lifecycle --init=init --step=step \
            --backend=tlc --invariants lifecycle_safety \
            --temporal=acquisition_eventually_settles,running_cycle_eventually_settles,close_eventually_terminates
