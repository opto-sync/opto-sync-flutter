name: Android beta AAB

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Semantic version in MAJOR.MINOR.PATCH form
        required: true
        type: string
      build_number:
        description: Positive, monotonically increasing Play build number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-beta-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.2

jobs:
  build-aab:
    name: Build protected Opto Sync Android beta
    environment: mobile-release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Validate release request and policy
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            printf 'error: release_version must be MAJOR.MINOR.PATCH\n' >&2
            exit 1
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            printf 'error: build_number must be a positive integer\n' >&2
            exit 1
          }
          python3 tool/check_android_release_contract.py
          python3 -m unittest tool/test_android_release_contract.py
      - name: Install locked dependencies and test
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - name: Decode protected release keystore
        shell: bash
        env:
          OPTO_SYNC_ANDROID_KEYSTORE_BASE64: ${{ secrets.OPTO_SYNC_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${OPTO_SYNC_ANDROID_KEYSTORE_BASE64:-}" ]]; then
            printf 'error: protected Opto Sync Android keystore is unavailable\n' >&2
            exit 1
          fi
          keystore_path="${RUNNER_TEMP}/opto-sync-release.keystore"
          if ! printf '%s' "$OPTO_SYNC_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"; then
            printf 'error: protected Opto Sync Android keystore is not valid base64\n' >&2
            exit 1
          fi
          test -s "$keystore_path" || {
            printf 'error: protected Opto Sync Android keystore decoded to an empty file\n' >&2
            exit 1
          }
          chmod 600 "$keystore_path"
      - name: Build and verify signed beta bundle
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          OPTO_SYNC_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/opto-sync-release.keystore
          OPTO_SYNC_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.OPTO_SYNC_ANDROID_KEYSTORE_PASSWORD }}
          OPTO_SYNC_ANDROID_KEY_ALIAS: ${{ secrets.OPTO_SYNC_ANDROID_KEY_ALIAS }}
          OPTO_SYNC_ANDROID_KEY_PASSWORD: ${{ secrets.OPTO_SYNC_ANDROID_KEY_PASSWORD }}
          OPTO_SYNC_ANDROID_CERT_SHA256: ${{ secrets.OPTO_SYNC_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          expected_fingerprint="$(printf '%s' "$OPTO_SYNC_ANDROID_CERT_SHA256" | tr -d '[:space:]:-' | tr '[:lower:]' '[:upper:]')"
          [[ "$expected_fingerprint" =~ ^[0-9A-F]{64}$ ]] || {
            printf 'error: OPTO_SYNC_ANDROID_CERT_SHA256 must be 64 hexadecimal digits\n' >&2
            exit 1
          }
          certificate_path="${RUNNER_TEMP}/opto-sync-release-certificate.pem"
          keytool -exportcert -rfc \
            -keystore "$OPTO_SYNC_ANDROID_KEYSTORE_PATH" \
            -storepass:env OPTO_SYNC_ANDROID_KEYSTORE_PASSWORD \
            -alias "$OPTO_SYNC_ANDROID_KEY_ALIAS" > "$certificate_path"
          actual_fingerprint="$(openssl x509 -in "$certificate_path" -outform der | sha256sum | awk '{print toupper($1)}')"
          [[ "$actual_fingerprint" == "$expected_fingerprint" ]] || {
            printf 'error: Opto Sync keystore certificate fingerprint is not approved\n' >&2
            exit 1
          }

          symbols_dir="build/app/outputs/symbols/${RELEASE_VERSION}-${BUILD_NUMBER}"
          flutter build appbundle --release \
            --build-name "$RELEASE_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --obfuscate \
            --split-debug-info "$symbols_dir"
          bundle='build/app/outputs/bundle/release/app-release.aab'
          test -s "$bundle"
          jarsigner -verify "$bundle" >/dev/null
          tar -czf build/app/outputs/opto-sync-obfuscation-symbols.tar.gz -C "$symbols_dir" .

          artifact_sha256="$(sha256sum "$bundle" | awk '{print $1}')"
          symbols_sha256="$(sha256sum build/app/outputs/opto-sync-obfuscation-symbols.tar.gz | awk '{print $1}')"
          dependencies_sha256="$(sha256sum pubspec.lock | awk '{print $1}')"
          printf '%s  %s\n' "$artifact_sha256" "$(basename "$bundle")" > "${bundle}.sha256"
          printf '%s  %s\n' "$symbols_sha256" 'opto-sync-obfuscation-symbols.tar.gz' > build/app/outputs/opto-sync-obfuscation-symbols.tar.gz.sha256
          python3 - "$bundle" "$artifact_sha256" "$symbols_sha256" "$dependencies_sha256" "$expected_fingerprint" <<'PY'
          import json
          import os
          import pathlib
          import sys

          bundle, artifact_sha, symbols_sha, dependencies_sha, fingerprint = sys.argv[1:]
          evidence = {
              "schemaVersion": 1,
              "sourceSha": os.environ["GITHUB_SHA"],
              "releaseVersion": os.environ["RELEASE_VERSION"],
              "buildNumber": int(os.environ["BUILD_NUMBER"]),
              "artifact": pathlib.Path(bundle).name,
              "artifactSha256": artifact_sha,
              "obfuscationSymbolsSha256": symbols_sha,
              "pubspecLockSha256": dependencies_sha,
              "certificateSha256": fingerprint,
              "signatureVerified": True,
              "sourceChecks": ["formal-lifecycle", "android-release-contract", "format", "analyze", "test"],
          }
          pathlib.Path(f"{bundle}.manifest.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Upload signed beta evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opto-sync-android-beta-${{ github.sha }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
            build/app/outputs/bundle/release/app-release.aab.manifest.json
            build/app/outputs/opto-sync-obfuscation-symbols.tar.gz
            build/app/outputs/opto-sync-obfuscation-symbols.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Remove protected signing material
        if: always()
        shell: bash
        run: |
          find "${RUNNER_TEMP}" -maxdepth 1 -type f \
            \( -name 'opto-sync-release.keystore' -o -name 'opto-sync-release-certificate.pem' \) \
            -exec shred -u {} +
